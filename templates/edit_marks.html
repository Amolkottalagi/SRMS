{% extends "base.html" %}

{% block title %}Edit Marks | SRMS{% endblock %}

{% block content %}
<div class="row justify-content-center w-100 m-0">
    <div class="col-md-10 col-lg-8">
        
        <div class="glass-panel p-5 animate-fade-in">
            
            <div class="d-flex align-items-center gap-3 mb-5">
                <a href="{{ url_for('marks_report') }}" class="btn btn-sm btn-secondary-custom p-2 rounded-circle" title="Back to Reports">
                    <i class="bi bi-arrow-left" style="font-size: 1.2rem;"></i>
                </a>
                <div>
                    <h2 class="text-white mb-0">✏️ Edit Marks</h2>
                    <p class="text-muted mb-0">Modify subject marks for Roll No: <strong class="text-white">{{ roll_no }}</strong></p>
                </div>
            </div>

            <form method="post" action="{{ url_for('edit_marks_post', roll_no=roll_no) }}">
                
                <div class="table-responsive mb-4">
                    <table class="table-glass">
                        <thead>
                            <tr>
                                <th>Subject Name</th>
                                <th style="width: 220px;">Marks Obtained</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for m in marks %}
                                <tr>
                                    <td class="fw-bold text-white">{{ m.subject_name }}</td>
                                    <td>
                                        <input type="number" 
                                               name="subject_{{ m.subject_id }}" 
                                               value="{{ m.marks }}" 
                                               min="0" max="100" 
                                               class="form-control form-glass text-center" 
                                               required>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-glow w-100 justify-content-center">
                        <i class="bi bi-check-circle-fill"></i> Save Changes
                    </button>
                    <a href="{{ url_for('marks_report') }}" class="btn btn-secondary-custom px-4 align-items-center d-inline-flex" style="border-radius: 30px;">Cancel</a>
                </div>

            </form>

        </div>
        
    </div>
</div>
{% endblock %}
